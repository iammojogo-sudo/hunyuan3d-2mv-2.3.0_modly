name: Build Windows rasterizer release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheel:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        profile: [cu124, cu128]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned MSVC compiler
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products '*' -property installationPath
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $result = Start-Process $installer -WindowStyle Hidden -Wait -PassThru -ArgumentList @('modify', '--installPath', "`"$installPath`"", '--add', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '--add', 'Microsoft.VisualStudio.Component.VC.14.39.17.9.x86.x64', '--quiet', '--norestart')
          if ($result.ExitCode -notin @(0, 3010)) { throw "MSVC installation failed: $($result.ExitCode)" }
      - name: Install CUDA build toolkit (no display driver)
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          if ($env:PROFILE -eq 'cu124') {
            $version = '12.4'
            $url = 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          } else {
            $version = '12.8'
            $url = 'https://developer.download.nvidia.com/compute/cuda/12.8.1/local_installers/cuda_12.8.1_572.61_windows.exe'
          }
          curl.exe --fail --location --retry 3 $url -o "$env:RUNNER_TEMP\cuda.exe"
          if ($LASTEXITCODE -ne 0) { throw 'CUDA download failed' }
          $result = Start-Process "$env:RUNNER_TEMP\cuda.exe" -WindowStyle Hidden -Wait -PassThru -ArgumentList @('-s', '-n', "nvcc_$version", "cudart_$version", "thrust_$version", "cuda_profiler_api_$version", "cublas_dev_$version", "cusparse_dev_$version", "cusolver_dev_$version", "curand_dev_$version", "cuobjdump_$version")
          if ($result.ExitCode -notin @(0, 3010)) { throw "CUDA installation failed: $($result.ExitCode)" }
          $cudaPath = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v$version"
          "CUDA_HOME=$cudaPath" >> $env:GITHUB_ENV
          "CUDA_PATH=$cudaPath" >> $env:GITHUB_ENV
          "$cudaPath\bin" >> $env:GITHUB_PATH
      - name: Install pinned build dependencies
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python -m pip install setuptools==75.8.0 wheel==0.45.1 ninja==1.11.1.3
          if ($LASTEXITCODE -ne 0) { throw 'Build dependencies failed' }
          if ($env:PROFILE -eq 'cu124') { $torchVersion = '2.6.0' } else { $torchVersion = '2.7.0' }
          python -m pip install "torch==$torchVersion" --index-url "https://download.pytorch.org/whl/$env:PROFILE"
          if ($LASTEXITCODE -ne 0) { throw 'PyTorch installation failed' }
      - name: Build multi-architecture wheel and verify import
        shell: pwsh
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -latest -products '*' -property installationPath
          $devCommand = "$installPath\Common7\Tools\VsDevCmd.bat"
          cmd.exe /d /s /c "`"`"$devCommand`" -arch=x64 -host_arch=x64 -vcvars_ver=14.39 && python tools/build_rasterizer_release.py $env:PROFILE`""
          if ($LASTEXITCODE -ne 0) { throw 'Rasterizer build failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: rasterizer-${{ matrix.profile }}-${{ matrix.python }}
          path: release-dist/*
          if-no-files-found: error
  draft-release:
    needs: wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-dist
          merge-multiple: true
      - name: Assemble complete release index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from rasterizer_distribution import PYTHONS, PROFILES
          root = Path('release-dist')
          wheels = [json.loads(p.read_text()) for p in root.glob('*.json')]
          expected = {(py, profile) for py in PYTHONS for profile in PROFILES}
          assert len(wheels) == len(expected)
          assert {(w['python'], w['profile']) for w in wheels} == expected
          (root / 'index.json').write_text(json.dumps({'version': 1, 'wheels': wheels}, indent=2))
          PY
      - name: Create draft release for GPU validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create rasterizer-v1 release-dist/*.whl release-dist/index.json --draft --target "$GITHUB_SHA" --title 'Multi-architecture Windows rasterizer v1' --notes 'Pinned PyTorch/CUDA builds for Modly Python 3.11. Import and embedded architecture checks passed in CI. Validate GPU launches on representative legacy, RTX 40-series and RTX 50-series hardware before publishing. Users do not need CUDA Toolkit or MSVC.'
